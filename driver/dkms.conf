PACKAGE_NAME="aipu"
PACKAGE_VERSION="6.0.1"
BUILD_EXCLUSIVE_KERNEL="$(
    kconf=${kernel_source_dir}/include/config/auto.conf
    [ -r $kconf ] || kconf=${kernel_source_dir}/.config
    if [ -r $kconf ] && grep -q '^CONFIG_ARCH_CIX=[ym]$' $kconf; then
        echo '.*'   # build on this kernel
    else
        echo 'a^'   # match nothing -> DKMS skips via BUILD_EXCLUSIVE
    fi
)"
BUILT_MODULE_NAME[0]="aipu"
DEST_MODULE_LOCATION[0]="/updates"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build BUILD_AIPU_VERSION_KMD=BUILD_ZHOUYI_V3 BUILD_TARGET_PLATFORM_KMD=BUILD_PLATFORM_SKY1 BUILD_NPU_DEVFREQ=y COMPASS_DRV_BTENVAR_KMD_VERSION=${PACKAGE_VERSION}"
CLEAN="make clean"

BUILD_AIPU_VERSION_KMD="BUILD_ZHOUYI_V3"
BUILD_TARGET_PLATFORM_KMD="BUILD_PLATFORM_SKY1"
BUILD_NPU_DEVFREQ="y"

